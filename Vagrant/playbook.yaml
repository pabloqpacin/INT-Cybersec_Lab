---
- name: Apply common configuration to all machines
  hosts: remote
  become: true
  tasks:
    - name: Set Spanish timezone
      file:
        src: /usr/share/zoneinfo/Europe/Madrid
        dest: /etc/localtime
        state: link
        force: true

    - name: Configure apt to show versions
      lineinfile:
        path: /etc/apt/apt.conf.d/99show-versions
        line: 'APT::Get::Show-Versions "true";'
        create: true

    - name: Configure /etc/hosts with custom DNS entries
      blockinfile:
        path: /etc/hosts
        block: |
          # Custom DNS entries for home-soc lab
          172.26.10.11 kali.local
          172.26.10.12 server.local
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Custom DNS"
        state: present

- name: Configure Kali Linux machines
  hosts: kali
  become: true
  roles:
    - kali

- name: Configure Debian servers
  hosts: servers
  become: true
  roles:
    - docker
    - server
